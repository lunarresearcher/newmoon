<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Post cards for the Newmoon account: 1080x1350, one idea per card. */
:root{--bg:#06080d;--panel:#0b0f17;--tile:#0f1520;--line:#1b2331;--line2:#273144;--text:#e6eaf2;--mute:#97a1b5;--dim:#5d687d;--moon:#efe9dc;--acc:#a3b6ff;--ok:#62d3a2;--warn:#e9b45b;--bad:#ef8a8a;--m:"JetBrains Mono",monospace;--g:Geist,sans-serif}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg)}
.card{width:1080px;height:1350px;position:relative;overflow:hidden;color:var(--text);font-family:var(--g);background:radial-gradient(90% 60% at 70% 40%,#111a2b 0%,var(--bg) 70%)}
.stars{position:absolute;inset:0}
.top{position:absolute;left:64px;right:64px;top:58px;display:flex;align-items:center;gap:14px;z-index:2}
.top img{width:52px;height:52px}.top .w{font:700 36px var(--g);letter-spacing:-.02em}.top .w span{color:var(--dim)}
.top .chip{margin-left:auto;font:500 18px var(--m);color:var(--mute);border:2px solid var(--line2);border-radius:999px;padding:9px 16px}.top .chip b{color:var(--text);font-weight:600}
.k{font:500 20px var(--m);color:var(--dim)}.k b{color:var(--acc);font-weight:500}
h1{margin:0;font:600 84px/.98 var(--g);letter-spacing:-.04em;text-wrap:balance}h1 span{color:var(--dim)}
h2{margin:0;font:600 64px/1 var(--g);letter-spacing:-.035em}
p{margin:0;font:400 28px/1.4 var(--g);color:var(--mute)}p b{color:var(--text);font-weight:500}
.main{position:absolute;left:64px;right:64px;top:170px;bottom:150px;display:flex;flex-direction:column;gap:30px;z-index:2}
.foot{position:absolute;left:64px;right:64px;bottom:58px;display:flex;align-items:center;justify-content:space-between;font:500 20px var(--m);color:var(--dim);z-index:2}
.foot .url{background:var(--moon);color:var(--bg);border-radius:12px;padding:12px 20px;font-weight:600}.foot .url span{color:#4f63b8}
.chipS{display:inline-flex;align-items:center;gap:10px;height:42px;padding:0 16px;border:2px solid var(--line2);border-radius:9px;font:500 16px var(--m);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.chipS::before{content:"";width:10px;height:10px;border-radius:2px;background:currentColor}
.c-lit{color:var(--moon)}.c-ok{color:var(--ok)}.c-info{color:var(--acc)}.c-warn{color:var(--warn)}.c-dim{color:var(--dim)}
.panel{border:2px solid var(--line2);border-radius:18px;background:var(--panel);padding:24px 28px}
.n{font:500 18px var(--m);color:var(--acc);border:2px solid var(--line2);border-radius:999px;width:46px;height:46px;display:grid;place-items:center;flex:none}
.mascot{position:absolute;z-index:1}
canvas{display:block}
</style></head><body>
<div id="root"></div>
<script src="_moon.js"></script>
<script>
const SITES = ["BeenVerified", "CheckPeople", "Clustal", "Intelius", "Men Stopping Violence", "MyLife", "Nuwber", "SmartBackgroundChecks", "Spokeo", "That\u2019s Them", "Whitepages", "Acxiom", "Ancestry", "FamilyTreeNow", "FastPeopleSearch", "USPhoneBook", "Archives", "Classmates", "Cyber Background Checks", "EveryJoe", "Facecheck", "FamilySearch", "FreePeopleDirectory", "InfoTracer", "National Public Data", "PeopleByName", "PeopleSearchNow", "PimEyes", "PrivateEye", "PrivateRecords", "PropertyRecs", "Searchbug", "SearchPeopleFree", "SearchQuarry", "Social Catfish", "SpyFly", "TruePeopleSearch.com", "TruePeopleSearch.net", "UN Public Administration Network", "United States Phone Book", "UnMask", "USA People Search", "Veripages", "VoterRecords", "ZoomInfo", "PeekYou", "Pipl", "PeopleFinders", "ClustrMaps", "Neighbor.report", "FastBackgroundCheck", "IDCrawl", "PeopleWhiz", "CocoFinder", "Kiwi Searches", "Persopo", "OfficialUSA", "LocateFamily", "PublicDataUSA", "USA-Official", "PublicRecordsNow", "Dataveria", "Verecor", "Virtory", "Vericora", "NeighborWho", "Ownerly", "Truecaller", "Sync.me", "NumLookup", "Spytox", "LexisNexis", "Epsilon"];
const TOPBAR = `<div class="top"><img src="logo.svg"><div class="w">NEW<span>MOON</span></div><div class="chip">powered by <b>Grok</b></div></div>`;
const foot = (l = "free · no account · nothing leaves your browser") => `<div class="foot"><span>${l}</span><span class="url"><span>$ </span>newmoon.website</span></div>`;
const row = (t, s, c, l) => `<div style="display:flex;align-items:center;gap:18px;padding:14px 0;border-bottom:2px solid var(--line)"><div style="flex:1;min-width:0"><div style="font:500 28px var(--g)">${t}</div><div style="font:400 17px var(--m);color:var(--dim)">${s}</div></div><span class="chipS ${c}">${l}</span></div>`;
const CARDS = {
  intro: () => `${TOPBAR}<img class="mascot" src="newmoon-idle.svg" style="right:-60px;top:330px;width:640px">
    <div class="main" style="top:220px;max-width:640px"><div class="k"><b>//</b> your privacy assistant</div>
    <h1>Your number,<br><span>off the</span> lists.</h1>
    <p style="margin-top:10px">Newmoon finds your phone number and home address on <b>73 people-search sites</b> and hands Grok the plan to take them down.</p>
    <div style="display:grid;gap:14px;margin-top:20px;font:500 22px var(--m);color:var(--mute)"><span>→ <b style="color:var(--text);font-weight:500">Grok scans</b> where you're listed</span><span>→ <b style="color:var(--text);font-weight:500">6 Grok Bots</b> file every opt-out</span><span>→ <b style="color:var(--text);font-weight:500">rechecks</b> every new moon</span></div></div>${foot()}`,
  steps: () => `${TOPBAR}<div class="main"><div class="k"><b>//</b> how it works</div><h2>Three steps.<br><span style="color:var(--dim)">One of them is yours.</span></h2>
    <div style="display:grid;gap:22px;margin-top:10px">
    <div class="panel" style="display:flex;gap:22px"><span class="n">1</span><div style="flex:1;display:grid;gap:14px"><div style="font:600 32px var(--g)">Type your name</div>
      <div style="display:flex;gap:12px"><div style="flex:1;border:2px solid var(--acc);border-radius:10px;padding:14px 16px;font:400 22px var(--g)">Jordan Avery · Austin, TX</div><div style="background:var(--moon);color:var(--bg);border-radius:10px;padding:14px 18px;font:600 20px var(--m)"><span style="color:#4f63b8">▸</span> find me with Grok</div></div></div></div>
    <div class="panel" style="display:flex;gap:22px"><span class="n">2</span><div style="flex:1;display:grid;gap:4px"><div style="font:600 32px var(--g);margin-bottom:6px">Grok finds you</div>${row("Whitepages","phone + home address","c-lit","listed")}${row("Truecaller","your name on your number","c-lit","listed")}${row("FastPeopleSearch","searched 3 ways","c-ok","not listed")}</div></div>
    <div class="panel" style="display:flex;gap:22px"><span class="n">3</span><div style="flex:1;display:grid;gap:12px"><div style="font:600 32px var(--g)">You say yes. Grok Bot files it.</div>
      <div style="font:500 26px var(--g)"><span style="color:var(--dim)">“</span>Remove the listing for (512) •••-••41. Email only, no ID.<span style="color:var(--dim)">”</span></div>
      <div style="font:500 22px var(--m)"><span style="color:var(--acc)">❯</span> approve? [y/N] <span style="color:var(--ok)">y ✓ submitted</span></div></div></div>
    </div></div>${foot()}`,
  crew: () => { const C = [["01","Scout","finds your listings","searches for anyone but you"],["02","Filer","files every opt-out","submits without your yes"],["03","Clerk","clicks the confirmation email","opens any other email"],["04","Registry","Do Not Call, one time","hands over an SSN or ID"],["05","Watch","rechecks every new moon","re-files without asking"],["06","Ledger","one sheet, every line with proof","says removed without proof"]];
    return `${TOPBAR}<div class="main"><div class="k"><b>//</b> the crew</div><h2>Six Grok Bots.<br><span style="color:var(--dim)">One job each.</span></h2>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:8px">${C.map(([n,name,job,nev]) => `<div class="panel" style="display:grid;gap:16px;padding:32px 28px"><div style="display:flex;align-items:baseline;gap:12px"><span style="font:500 18px var(--m);color:var(--dim)">${n}</span><span style="font:600 34px var(--g)">${name}</span></div><div style="font:400 25px var(--g);color:var(--mute);min-height:64px">${job}</div><div style="display:flex;gap:10px;align-items:flex-start;font:400 17px/1.4 var(--m);color:var(--mute)"><span style="color:var(--bad);border:2px solid rgba(239,138,138,.4);border-radius:5px;padding:1px 7px;font-size:13px;letter-spacing:.12em">NEVER</span>${nev}</div></div>`).join("")}</div></div>${foot()}`; },
  sites: () => `${TOPBAR}<div class="main"><div class="k"><b>//</b> the list</div><h1 style="font-size:76px">Where do spam callers<br><span>get your number?</span></h1>
    <div style="display:flex;flex-wrap:wrap;gap:10px 22px;font:500 21px/1.35 var(--m);margin-top:6px">${SITES.map((s, i) => `<span style="color:${[3,8,11,17,24,30,41,52,60].includes(i) ? "var(--dim)" : "var(--moon)"};${[3,8,11,17,24,30,41,52,60].includes(i) ? "text-decoration:line-through" : ""}">${s}</span>`).join("")}</div>
    <div style="margin-top:auto;display:flex;align-items:flex-end;gap:22px"><span style="font:600 150px/.8 var(--g);letter-spacing:-.05em">73</span><span style="font:500 20px/1.5 var(--m);color:var(--dim);letter-spacing:.12em">PEOPLE-SEARCH AND<br>CALLER-ID SITES.<br><span style="color:var(--text)">ONE PLAN.</span></span></div></div>${foot("every site with its direct opt-out link")}`,
  moons: () => `${TOPBAR}<img class="mascot" src="newmoon-sleep.svg" style="right:-40px;top:190px;width:420px;opacity:.95">
    <div class="main"><div class="k"><b>//</b> rechecks</div><h2 style="max-width:620px">Brokers buy your data back.<br><span style="color:var(--dim)">Watch checks every new moon.</span></h2>
    <div id="moonlist" style="display:grid;gap:0;margin-top:40px"></div>
    <p style="font-size:24px">New moons computed with Jean Meeus' lunar formulas. Add all twelve to your calendar in one click.</p></div>${foot("recheck every 29.5 days")}`,
  price: () => `${TOPBAR}<img class="mascot" src="newmoon-done.svg" style="right:20px;top:230px;width:380px">
    <div class="main" style="top:250px"><div class="k"><b>//</b> the price</div><div style="font:600 220px/.85 var(--g);letter-spacing:-.06em">$0.</div><div style="font:600 92px/1 var(--g);letter-spacing:-.04em;color:var(--dim)">Not $129 a year.</div>
    <div style="display:grid;gap:16px;margin-top:40px;font:500 26px var(--g)">
      <div style="display:flex;gap:16px;align-items:center"><span class="chipS c-ok">free</span>Newmoon: the plan, prompts, tracker and 73 links</div>
      <div style="display:flex;gap:16px;align-items:center"><span class="chipS c-info">yours</span>Grok does the work in your own account</div>
      <div style="display:flex;gap:16px;align-items:center"><span class="chipS c-dim">$129/yr</span><span style="color:var(--mute)">DeleteMe, for one person</span></div></div></div>${foot()}`,
  never: () => { const N = ["search for anyone but you","send a form without your yes","upload your ID or a selfie","pay, enter a card or start a trial","mark a site removed without proof","send your data to a server. There isn't one."];
    return `${TOPBAR}<img class="mascot" src="newmoon-found.svg" style="right:-70px;bottom:130px;width:360px">
    <div class="main"><div class="k"><b>//</b> the rules</div><h2>What it will<br><span style="color:var(--dim)">never do.</span></h2>
    <div style="display:grid;gap:0;margin-top:20px;max-width:760px">${N.map(t => `<div style="display:flex;gap:22px;align-items:center;padding:22px 0;border-bottom:2px solid var(--line)"><span style="color:var(--bad);border:2px solid rgba(239,138,138,.45);border-radius:6px;padding:4px 10px;font:500 15px var(--m);letter-spacing:.14em">NEVER</span><span style="font:500 32px var(--g)">${t}</span></div>`).join("")}</div></div>${foot("written into every prompt")}`; },
  moods: () => { const P = [["idle","newmoon-idle.svg","ready"],["scan","newmoon-scan.svg","scanning 73 sites"],["found","newmoon-found.svg","found you"],["done","newmoon-done.svg","listing removed"],["sleep","newmoon-sleep.svg","new moon. all clear"]];
    return `${TOPBAR}<div class="main"><div class="k"><b>//</b> meet NEWMOON</div><h2>Its mood is<br><span style="color:var(--dim)">your plan.</span></h2>
    <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:18px 30px;margin-top:20px">${P.map(([k,f,l], i) => `<div style="display:grid;justify-items:center;gap:4px;width:290px"><img src="${f}" style="width:270px;height:270px"><span style="font:500 20px var(--m);color:${["var(--acc)","var(--acc)","var(--warn)","var(--ok)","var(--dim)"][i]}">${l}</span></div>`).join("")}</div></div>${foot("NEWMOON reacts as your listings come down")}`; }
};
function stars(el){ const c = document.createElement("canvas"); c.width = 1080; c.height = 1350; c.className = "stars"; const x = c.getContext("2d"); let s = 7; const r = () => (s = (s*16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 120; i++){ x.fillStyle = `rgba(230,234,242,${.06 + r()*.28})`; x.beginPath(); x.arc(r()*1080, r()*1350, r() < .9 ? 1 : 1.8, 0, 6.29); x.fill(); } el.prepend(c); }
window.show = async name => {
  const root = document.getElementById("root"); root.innerHTML = `<div class="card" id="card">${CARDS[name]()}</div>`; stars(document.getElementById("card"));
  if (name === "moons"){ texture(); const m = window.MOONS; document.getElementById("moonlist").innerHTML = m.slice(0,6).map((d, i) => `<div style="display:flex;align-items:center;gap:24px;padding:16px 0;border-bottom:2px solid var(--line)"><canvas width="96" height="96" style="width:48px;height:48px" data-k="${i===0?0:0}"></canvas><span style="font:${i===0?600:500} 34px var(--g);color:${i===0?"var(--text)":"var(--mute)"}">${d}</span>${i===0?'<span class="chipS c-info" style="margin-left:auto">next recheck</span>':''}</div>`).join("");
    document.querySelectorAll("#moonlist canvas").forEach(c => drawMoon(c, 0, false)); }
  await document.fonts.ready; await Promise.all([...document.images].map(i => i.complete ? 1 : new Promise(r => { i.onload = r; i.onerror = r; })));
  return true;
};
</script></body></html>
